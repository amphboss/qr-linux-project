version: "3.9"

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../generated_qr:/app/generated_qr
      - ../logs:/app/logs

  client:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
    depends_on:
      - server
    volumes:
      - ../generated_qr:/app/generated_qr
      - ../logs:/app/logs
